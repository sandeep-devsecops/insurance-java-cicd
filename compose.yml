version: "3.8"
services:
  insurancedb:
    image: ${DOCKER_USER}/insurance-db:${IMAGE_TAG}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: insurance
      MYSQL_USER: insurance
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes: [insurance_data:/var/lib/mysql]
    networks: [insurance_net]
    deploy:
      placement:
        constraints: [node.role == manager]
  application:
    image: ${DOCKER_USER}/insurance-app:${IMAGE_TAG}
    environment:
      DB_HOST: insurancedb
      DB_USER: insurance
      DB_PASSWORD: ${DB_PASSWORD}
    ports: ["1234:8080"]
    networks: [insurance_net]
networks:
  insurance_net:
    driver: overlay
volumes:
  insurance_data:
